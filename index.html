<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel With Ease</title>

<!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     <style>
        #map { height: 700px; }
        .popup-image {
            max-width: 200px;
            height: auto;
        }
        
    
     </style>
     <link rel="stylesheet" href="dashboard.css"/>
</head>
<body>
    <h1>Travel With Ease</h1>
     <div class="row">
        <div class="col-4">
     <h2>Current Weather</h2>
    <button onclick="getWeather()">Get Weather</button>
    <div id="weatherResult"></div>
    </div>
    <div class="col-8">
     <div id="map"></div>
     </div>
        </div>
        <div class="container mt-3">
    <h2>Recommended Places</h2>
    <div id="crCardList"></div>
</div>

</body>
<script>
    let map;
    const markerMap={};
   function initMap(mapDataUrl) {
     map = L.map('map').setView([8.367481183366511, 124.86349857743643], 17);

    //OpenStreetMap Tile Layer
    const openStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
//satellite
    const satellite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 
    {attribution: 'Tiles (c) Esri - Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'}  
    );
openStreetMap.addTo(map);
console.log("Base map tile layer loaded" + Date());


const markerGroups ={};
 
const GAS = L.icon ({
iconUrl: 'icons/gas.png',
iconSize: [38, 38],
iconAnchor: [19,38],
popupAnchor:[0,-38]
});
const CONVE = L.icon ({
iconUrl: 'icons/store.png',
iconSize: [38, 38],
iconAnchor: [19,38],
popupAnchor:[0,-38]
});
const HOSPI = L.icon ({
iconUrl: 'icons/hospital.png',
iconSize: [38, 38],
iconAnchor: [19,38],
popupAnchor:[0,-38]
});
const RESTAU = L.icon ({
iconUrl: 'icons/restaurant.png',
iconSize: [38, 38],
iconAnchor: [19,38],
popupAnchor:[0,-38]
});
const HOTEL = L.icon ({
iconUrl: 'icons/hotel.png',
iconSize: [38, 38],
iconAnchor: [19,38],
popupAnchor:[0,-38]
});

fetch(mapDataUrl)
    .then(response => response.json())
    .then(data =>{
       const filteredData = data.filter(pin => {
    const match = pin.rating.match(/[\d.]+/);
    if (!match) return false;
    const ratingNumber = parseFloat(match[0]);
    return ratingNumber >= 3;
});

filteredData.forEach(pin => {
            const type = pin.locationType || "Other";

            if(!markerGroups[type]) {
                markerGroups[type] = L.layerGroup();
            }
           let selectedIcon;


if (pin.locationType === "Gas Station") {
    selectedIcon = GAS;
} else if (pin.locationType === "Convenience Store"){
    selectedIcon =CONVE;
    } else if (pin.locationType === "Hospital"){
    selectedIcon =HOSPI;
    } else if (pin.locationType === "Restaurant"){
    selectedIcon =RESTAU;
} else {
    selectedIcon =HOTEL;
}

       const marker = L.marker([pin.lat, pin.lng], { icon: selectedIcon }).addTo(map);
       markerMap[pin.id] = marker;
            const img = `<img src='${pin.img}' class="popup-image">`;
            marker.bindPopup(`${img}<br><b> ${pin.title} </b><br> ${pin.description}<br> ${pin.locationType}<br>${pin.rating}`);
            console.log(`${pin.name} Loaded` +Date());

            markerGroups[type].addLayer(marker);
    });

        //add all groups to map initially
        Object.values(markerGroups).forEach(group => group.addTo(map));

            const baseMaps={
                "OpenStreetMap": openStreetMap,
                "Satellite": satellite
            }
            const overlayMaps = {};
            Object.keys(markerGroups).forEach(type => {
                overlayMaps[type] = markerGroups[type];
            });
            L.control.layers(baseMaps, overlayMaps,{collapsed: false}).addTo(map);

})
.catch(err => console.error('Error loading JSON:', err));

        
}
  
 

     const apiKey = "55f9a16fb9c7ec4188e6d189f64c7ea8";

    async function getWeather(){
        console.log("Prompt opened. "+ Date());
        const city = prompt("Enter a city name");
        console.log("Prompt closed. "+ Date());
        if(!city){
            alert("No city entered.");
            console.log("No city entered. " + Date());
            return;
        }

        const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

        try{
            const response = await fetch(url);
            if(!response.ok) throw new Error("City not found");

            const data = await response.json();

            const weatherResult = document.getElementById("weatherResult");
            weatherResult.innerHTML = `
                <h2>${data.name}, ${data.sys.country}</h2>
                <p>Temperature: ${data.main.temp} C</p>
                <p>Weather: ${data.weather[0].description}</p>
                <p>Humidity: ${data.main.humidity} %</p>
                <p>Wind Speed: ${data.wind.speed} m/s</p>
                <p></p>

            `;

        }catch (error){
            alert("Error: " + error.message);
            console.log("Error: " + error.message);
        }}
//render cards
       function renderCards(crDataUrl, containerId) {
    fetch(crDataUrl)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            // Filter only ratings >= 4
            const filteredData = data.filter(cr => {
                const match = cr.rating.match(/[\d.]+/);
                if (!match) return false;
                const ratingNumber = parseFloat(match[0]);
                return ratingNumber >= 3;
            });

            // Group cards by locationType
            const groups = {};
            filteredData.forEach(cr => {
                const type = cr.locationType || "Other";
                if (!groups[type]) groups[type] = [];
                groups[type].push(cr);
            });

            // Render each group as a separate row
            Object.keys(groups).forEach(type => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'category-row mb-4';

                const heading = document.createElement('h3');
                heading.textContent = type; // Category name
                rowDiv.appendChild(heading);

                const cardsContainer = document.createElement('div');
                cardsContainer.className = 'd-flex flex-row flex-wrap gap-3';

                groups[type].forEach(cr => {
                    const cardHTML = `
                        <div class="card" style="width: 18rem;" data-crid="${cr.id}">
                            <img src="${cr.img}" class="card-img-top" alt="${cr.title}">
                            <div class="card-body">
                                <h5 class="card-title">${cr.title}</h5>
                                <p class="card-text">${cr.rating}</p>
                                <p class="card-text">${cr.description}</p>
                            </div>
                        </div>
                    `;
                    cardsContainer.innerHTML += cardHTML;
                });

                rowDiv.appendChild(cardsContainer);
                container.appendChild(rowDiv);
            });

            // Add click event to fly to marker and scroll map
            container.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => {
                    const crID = card.getAttribute('data-crid');
                    const marker = markerMap[crID];
                    if(marker){
                        document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
                        map.flyTo(marker.getLatLng(), 19, { duration: 0.5 });
                        marker.openPopup();
                    }
                });
            });
        })
        .catch(error => console.error("Error loading JSON:", error));
}




// Initialize on DOM ready
document.addEventListener("DOMContentLoaded", () => {
    initMap('travel2.json');
    renderCards('travel2.json','crCardList');
});
</script>
</html>
